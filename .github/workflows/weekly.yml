# Builds the weekly submission and review report on GitHub's Linux runners and
# commits them to forecasts/. It does NOT submit: review the report, then run
# `bdbv submit` from any machine with a clone of your hub fork.
name: weekly-forecast

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC; the hub accepts submissions Sunday-Tuesday (Kinshasa time)
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Reference date (Saturday, YYYY-MM-DD); blank for this week"
        required: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: bdbv-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: bdbv-${{ hashFiles('pyproject.toml') }}-
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all]"
      - name: Forecast
        env:
          REF: ${{ inputs.reference_date }}
        run: bdbv forecast ${REF:+--reference-date "$REF"}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_id }}
          path: forecasts/
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts
          git diff --cached --quiet || git commit -m "Forecast outputs $(date +%F)"
          git push
